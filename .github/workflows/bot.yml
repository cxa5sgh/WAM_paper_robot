name: WAM Paper Bot

permissions:
  contents: write

on:
  schedule:
    # 每周一/三/五北京时间 09:00 运行 (UTC 01:00)
    - cron: '0 1 * * 1,3,5'
  workflow_dispatch:  # 手动触发,调试必备
    inputs:
      backfill_days:
        description: '回溯天数(0=默认最近 3 天)'
        required: false
        default: '0'

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python paper_bot.py
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}

      # 把去重状态写回仓库,防止重启后重复推送
      - name: Commit state
        run: |
          git config user.name github-actions-bot
          git config user.email bot@local
          git add seen.json run.log
          git diff --cached --quiet || git commit -m "bot state $(date -u +%F)" && git push
