name: WAM Paper Bot

permissions:
  contents: write

concurrency:
  group: wam-paper-bot
  cancel-in-progress: false

on:
  schedule:
    # 每周一北京时间 09:00 运行 (UTC 01:00)
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 手动触发,调试必备
    inputs:
      test_mode:
        description: '测试发送但不更新 seen.json'
        type: boolean
        required: false
        default: false
      backfill_days:
        description: '回溯天数(0=默认最近 7 天)'
        required: false
        default: '0'

env:
  FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
  FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
  FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}
  HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
  HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
  ALL_PROXY: ${{ secrets.ALL_PROXY }}
  NO_PROXY: localhost,127.0.0.1

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Feishu keyword
        run: |
          if [[ -z "$FEISHU_KEYWORD" ]]; then
            echo "::error::Missing FEISHU_KEYWORD repository secret. Set it to the exact keyword configured in the Feishu bot security settings."
            exit 1
          fi
        env:
          FEISHU_KEYWORD: ${{ secrets.FEISHU_KEYWORD }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run bot
        run: |
          if [[ "${{ inputs.test_mode }}" == "true" ]]; then
            python paper_bot.py --no-save-seen
          else
            python paper_bot.py
          fi
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}

      # 把去重状态写回仓库,防止重启后重复推送
      - name: Commit state
        run: |
          git config user.name github-actions-bot
          git config user.email bot@local
          git add seen.json run.log
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "bot state $(date -u +%F)"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "Could not rebase state commit onto origin/main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed, retrying ($attempt/3)"
          done
          exit 1
